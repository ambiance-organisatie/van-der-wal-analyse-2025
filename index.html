<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Van der Wal Analyse 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#13151f; --bg2:#191c29; --bg3:#20232f;
  --text:#e8eaf0; --sub:#8b8fa8; --sub2:#5c6079;
  --accent:#f68b2f;
  --accent2:#ffb066;
  --border:#2a2e3f;
  --up:#4caf7d; --down:#e0637a;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed; top:0; left:0; right:0; height:64px; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; background:rgba(19,21,31,0.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar .brand{display:flex; align-items:center; gap:12px; font-weight:700; font-size:15px; letter-spacing:.02em;}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.topbar .brand .excl-btw{color:var(--sub2); font-weight:500; font-size:11.5px; text-transform:none; letter-spacing:0;}
.dots{display:flex; gap:8px; flex-wrap:wrap; max-width:300px; justify-content:center;}
.dots button{
  width:8px; height:8px; border-radius:50%; border:none; background:var(--border);
  cursor:pointer; transition:all .25s; padding:0;
}
.dots button.active{background:var(--accent); width:22px; border-radius:4px;}
.scope-toggle{
  display:flex; background:var(--bg3); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;
}
.scope-toggle button{
  border:none; background:transparent; color:var(--sub); font-family:inherit; font-size:12.5px; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer; transition:all .2s;
}
.scope-toggle button.active{background:var(--accent); color:#1a1305;}
.deck{position:relative; width:100vw; height:100vh;}
.slide{
  position:absolute; inset:0; padding:104px 64px 48px;
  opacity:0; pointer-events:none; transform:translateY(14px);
  transition:opacity .5s ease, transform .5s ease;
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.slide.active{opacity:1; pointer-events:auto; transform:translateY(0);}
.slide-head{margin-bottom:28px;}
.eyebrow{color:var(--accent); font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;}
h1.slide-title{font-size:34px; font-weight:800; letter-spacing:-.01em;}
.slide-sub{color:var(--sub); font-size:14.5px; margin-top:6px; max-width:640px;}
.navhint{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:100;
  color:var(--sub2); font-size:12px; display:flex; gap:18px; align-items:center;
}
.navarrow{
  position:fixed; top:50%; transform:translateY(-50%); z-index:100; width:44px; height:44px; border-radius:50%;
  border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--sub); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px; transition:all .2s;
}
.navarrow:hover{background:var(--accent); color:#1a1305; border-color:var(--accent);}
#navPrev{left:18px;} #navNext{right:18px;}

.grid{display:grid; gap:20px;}
.card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:6px;}
.kpi-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:26px;}
.kpi-label{color:var(--sub); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.kpi-value{font-size:38px; font-weight:800; margin-top:10px; letter-spacing:-.01em;}
.kpi-foot{color:var(--sub2); font-size:12px; margin-top:8px;}

.funnel{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
.funnel-row{display:grid; grid-template-columns:170px 1fr 100px 70px; align-items:center; gap:16px;}
.funnel-label{font-size:13.5px; font-weight:600; color:var(--sub);}
.funnel-bar-track{height:34px; background:var(--bg3); border-radius:8px; overflow:hidden; position:relative;}
.funnel-bar{height:100%; border-radius:8px; width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
.funnel-amt{text-align:right; font-weight:700; font-size:14.5px;}
.funnel-pct{text-align:right; color:var(--sub); font-size:13px;}

.rank-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
.rank-row{display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-size:20px; font-weight:800; color:var(--accent2);}
.rank-name{font-size:17px; font-weight:700;}
.rank-sub{color:var(--sub); font-size:12.5px; margin-top:2px;}
.rank-amt{font-size:19px; font-weight:800; text-align:right;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; color:var(--sub); font-weight:600; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.05em; padding:0 12px 10px; border-bottom:1px solid var(--border);
}
thead th.num, td.num{text-align:right;}
tbody td{padding:12px 12px; border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; text-transform:uppercase; letter-spacing:.03em;}
.badge.rayon{background:rgba(139,143,168,.15); color:var(--sub);}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.ring-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
.ring-val{font-size:30px; font-weight:800;}
.ring-label{color:var(--sub); font-size:13px;}

.zone-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:6px;}
.zone-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.zone-label{font-size:13px; font-weight:700; color:var(--sub);}
.zone-omzet{font-size:22px; font-weight:800; margin-top:8px;}
.zone-bar-track{height:6px; background:var(--bg3); border-radius:4px; margin-top:10px; overflow:hidden;}
.zone-bar{height:100%; width:0; border-radius:4px; transition:width 1s ease;}
.zone-meta{color:var(--sub2); font-size:11.5px; margin-top:8px; line-height:1.5;}

.lev-bar-row{display:grid; grid-template-columns:190px 1fr 110px; align-items:center; gap:14px; padding:9px 0; border-bottom:1px solid var(--border);}
.lev-bar-row:last-child{border-bottom:none;}
.lev-name{font-size:13px; font-weight:600;}
.lev-track{height:20px; background:var(--bg3); border-radius:5px; overflow:hidden;}
.lev-fill{height:100%; border-radius:5px; width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
.lev-amt{text-align:right; font-size:12.5px; font-weight:700;}

#mapEl{flex:1; border-radius:var(--radius); overflow:hidden; min-height:400px; border:1px solid var(--border);}
.map-legend{position:absolute; bottom:26px; left:80px; background:rgba(25,28,41,.9); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:12px; color:var(--sub); z-index:400;}

.note{color:var(--sub2); font-size:11.5px; margin-top:14px; line-height:1.6;}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--bg3); color:var(--sub);}

.intro-slide{align-items:flex-start; justify-content:center; position:relative;}
.intro-circle{position:absolute; border-radius:50%; opacity:.08; background:var(--accent);}
.intro-title{font-size:60px; font-weight:800; letter-spacing:-.02em; line-height:1.05;}
.intro-sub{color:var(--sub); font-size:17px; margin-top:16px;}
.intro-logo{width:64px; height:64px; object-fit:contain; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.35);}
.intro-logo-row{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.intro-meta{margin-top:36px; display:flex; gap:28px;}
.intro-meta div{font-size:12.5px; color:var(--sub2); text-transform:uppercase; letter-spacing:.08em;}
.intro-meta b{display:block; color:var(--text); font-size:15px; font-weight:700; text-transform:none; letter-spacing:0; margin-top:4px;}

.overview-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:32px;}
.overview-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.overview-vestiging{font-size:15px; font-weight:800; margin-bottom:14px;}
.overview-row{padding:10px 0; border-bottom:1px solid var(--border);}
.overview-row:last-child{border-bottom:none;}
.overview-label{color:var(--sub); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
.overview-value{font-size:26px; font-weight:800; margin-top:4px;}
.overview-value.small{font-size:19px;}

.slot-slide{align-items:center; justify-content:center; height:100%;}
.slot-wrap{max-width:1100px; margin:0 auto; width:100%;}
.slot-title{font-size:42px; font-weight:800; letter-spacing:-.02em; max-width:640px;}
.slot-intro{color:var(--sub); font-size:15px; margin-top:14px; max-width:640px; line-height:1.6;}
.slot-cols{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:32px;}
.slot-col-title{font-size:15px; font-weight:700; margin-bottom:14px;}
.slot-bullet{display:flex; gap:10px; padding:9px 0; font-size:13.5px; color:var(--sub); border-bottom:1px solid var(--border); align-items:flex-start;}
.slot-bullet:last-child{border-bottom:none;}
.slot-bullet .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:7px; flex-shrink:0;}
.slot-question{
  margin-top:34px; padding:22px 28px; border-left:3px solid var(--accent); background:var(--bg2);
  border-radius:0 12px 12px 0; font-size:18px; font-weight:700; line-height:1.4;
}

.bh-headline{
  font-size:26px; font-weight:800; line-height:1.35; max-width:900px; margin-bottom:28px; letter-spacing:-.01em;
}
.bh-flow{display:grid; grid-template-columns:200px 1fr 200px; gap:0; align-items:center; margin-bottom:6px;}
.bh-node{
  background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:18px 16px;
  text-align:center; font-weight:700; font-size:14px; line-height:1.4;
}
.bh-node-source{background:var(--bg3);}
.bh-node-sub{color:var(--sub); font-weight:500; font-size:11px; display:block; margin-top:4px;}
.bh-dest{display:flex; flex-direction:column; gap:14px;}
.bh-flows{display:flex; flex-direction:column; gap:14px; padding:0 20px;}
.bh-flow-row{display:flex; flex-direction:column; gap:4px;}
.bh-flow-bar{height:14px; border-radius:7px; min-width:8px; transition:width .3s;}
.bh-flow-label{font-size:11.5px; color:var(--sub); font-weight:600;}
.bh-100bar{display:flex; width:100%; height:32px; border-radius:8px; overflow:hidden; margin-top:10px;}
.bh-100seg{display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; min-width:36px;}
.bh-pc-row{display:grid; grid-template-columns:50px 1fr 34px; align-items:center; gap:12px; padding:6px 0;}
.bh-pc-code{font-size:12.5px; font-weight:700; color:var(--sub);}
.bh-pc-track{height:10px; background:var(--bg3); border-radius:5px; overflow:hidden;}
.bh-pc-fill{height:100%; border-radius:5px;}
.bh-pc-val{font-size:12.5px; font-weight:700; text-align:right;}
.bh-question{font-size:16px; font-weight:700; color:var(--text); margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}

.login-gate{
  position:fixed; inset:0; z-index:1000; background:var(--bg);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
}
.login-card{
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:40px 36px; width:340px; text-align:center;
}
.login-logo{width:64px; height:64px; object-fit:contain; border-radius:14px; margin-bottom:20px; box-shadow:0 6px 20px rgba(0,0,0,.35);}
.login-title{font-size:18px; font-weight:800; margin-bottom:6px;}
.login-sub{color:var(--sub); font-size:13px; margin-bottom:24px;}
.login-input{
  width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; color:var(--text); font-family:inherit; font-size:14px; text-align:center;
  outline:none; transition:border-color .2s;
}
.login-input:focus{border-color:var(--accent);}
.login-input.error{border-color:var(--down); animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}
.login-btn{
  width:100%; margin-top:14px; background:var(--accent); color:#1a1305; border:none;
  border-radius:10px; padding:12px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  transition:opacity .2s;
}
.login-btn:hover{opacity:0.9;}
.login-error{color:var(--down); font-size:12.5px; margin-top:10px; min-height:16px;}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const LOGO_B64 = document.getElementById('logo-data').textContent.trim();
let state = { slide: 0, vestiging: 'Hilversum' };

function euroK(n){
  if(n===null || n===undefined) return '—';
  return '€ ' + Number(n).toLocaleString('nl-NL', {maximumFractionDigits:0});
}
function pct(n, decimals=1){
  if(n===null || n===undefined) return '—';
  return Number(n).toLocaleString('nl-NL', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}) + '%';
}
function num(n){
  if(n===null || n===undefined) return '—';
  return Number(n).toLocaleString('nl-NL');
}
function animateCount(elx, target, type, duration=900){
  const t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t-t0)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target*eased;
    elx.textContent = type==='euro' ? euroK(Math.round(val)) : type==='pct' ? pct(val,1) : num(Math.round(val));
    if(p<1) requestAnimationFrame(step);
    else elx.textContent = type==='euro' ? euroK(target) : type==='pct' ? pct(target,1) : num(target);
  }
  requestAnimationFrame(step);
}
function V(){ return DATA.meta.vestigingen[state.vestiging]; }
function ACCENT(){ return V().kleur; }
function shade(hex, amt){
  const c = hex.replace('#',''); const n = parseInt(c,16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function updateAccentVar(){
  document.documentElement.style.setProperty('--accent', ACCENT());
  document.documentElement.style.setProperty('--accent2', shade(ACCENT(), 40));
}

const SLIDES = [
  {id:'overview', render: renderOverview},
  {id:'omzetopbouw', render: renderOmzetopbouw},
  {id:'kwartaal', render: renderKwartaal},
  {id:'leadscore', render: renderLeadscore},
  {id:'leveranciers', render: renderLeveranciers},
  {id:'top5', render: renderTop5},
  {id:'afstand', render: renderAfstand},
  {id:'bussum-hilversum', render: renderBussumHilversum},
  {id:'rayon', render: renderRayon},
  {id:'klantherkomst', render: renderKlantherkomst},
  {id:'marktaandeel', render: renderMarktaandeel},
  {id:'kansen', render: renderKansen},
  {id:'kaart', render: renderKaart},
];

const deck = document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const section = document.createElement('section');
  section.className = 'slide'; section.id = 'slide-'+i;
  deck.appendChild(section);
});
const dotsWrap = document.getElementById('dots');
SLIDES.forEach((s,i)=>{
  const b = document.createElement('button');
  b.addEventListener('click', ()=>goTo(i));
  dotsWrap.appendChild(b);
});

function goTo(i){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  state.slide = i;
  document.querySelectorAll('.slide').forEach((el,idx)=> el.classList.toggle('active', idx===i));
  document.querySelectorAll('#dots button').forEach((el,idx)=> el.classList.toggle('active', idx===i));
  updateAccentVar();
  const section = document.getElementById('slide-'+i);
  section.innerHTML = SLIDES[i].render();
  triggerAnimations(section);
  document.getElementById('brandText').textContent = `Ambiance Van der Wal ${state.vestiging} · Analyse 2025`;
  if(SLIDES[i].id==='kaart') setTimeout(initMap, 60);
}
document.getElementById('navPrev').addEventListener('click', ()=>goTo(state.slide-1));
document.getElementById('navNext').addEventListener('click', ()=>goTo(state.slide+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(state.slide+1);
  if(e.key==='ArrowLeft') goTo(state.slide-1);
});
document.querySelectorAll('#scopeToggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.vestiging = b.dataset.vestiging;
    document.querySelectorAll('#scopeToggle button').forEach(x=>x.classList.toggle('active', x===b));
    updateAccentVar();
    const section = document.getElementById('slide-'+state.slide);
    section.innerHTML = SLIDES[state.slide].render();
    triggerAnimations(section);
    document.getElementById('brandText').textContent = `Ambiance Van der Wal ${state.vestiging} · Analyse 2025`;
    if(SLIDES[state.slide].id==='kaart') setTimeout(initMap, 60);
  });
});

function triggerAnimations(section){
  section.querySelectorAll('[data-countup]').forEach(elx=>{
    animateCount(elx, parseFloat(elx.dataset.countup), elx.dataset.type);
  });
  requestAnimationFrame(()=>{
    section.querySelectorAll('[data-barwidth]').forEach(b=>{ b.style.width = b.dataset.barwidth; });
    section.querySelectorAll('[data-barheight]').forEach(b=>{ b.style.height = b.dataset.barheight; });
    section.querySelectorAll('.ring-anim').forEach(r=>{
      r.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
      r.style.strokeDashoffset = r.dataset.ringoffset;
    });
  });
}

function renderOverview(){
  const vestigingen = Object.keys(DATA.meta.vestigingen);
  return `
  <div class="intro-slide" style="height:100%;">
    <div class="intro-circle" style="width:900px;height:900px;top:-380px;right:-320px;"></div>
    <div class="intro-circle" style="width:500px;height:500px;bottom:-260px;left:-180px;"></div>
    <div style="max-width:1100px; z-index:2; width:100%;">
      <div class="intro-logo-row"><img class="intro-logo" src="data:image/png;base64,${LOGO_B64}" alt="Ambiance logo"></div>
      <div class="eyebrow">Klantherkomstanalyse ${DATA.meta.periode[0]}</div>
      <div class="intro-title">Van der Wal</div>
      <div class="intro-sub">${vestigingen.join(' · ')}</div>
      <div class="overview-grid">
        ${vestigingen.map(v=>{
          const k = DATA.kpi[v]; const kleur = DATA.meta.vestigingen[v].kleur;
          return `
          <div class="overview-card" style="border-top:3px solid ${kleur};">
            <div class="overview-vestiging" style="color:${kleur};">${v}</div>
            <div class="overview-row">
              <div class="overview-label">Factuurwaarde</div>
              <div class="overview-value" data-countup="${k.factuurwaarde}" data-type="euro">€ 0</div>
            </div>
            <div class="overview-row">
              <div class="overview-label">Zakelijk aandeel</div>
              <div class="overview-value small" data-countup="${k.zakelijk_pct}" data-type="pct">0%</div>
            </div>
            <div class="overview-row">
              <div class="overview-label">Online aanvragen</div>
              <div class="overview-value small" data-countup="${k.online_aanvragen}" data-type="num">0</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderOmzetopbouw(){
  const o = DATA.omzetopbouw[state.vestiging];
  const rows = [
    {label:'Factuurwaarde', val:o.factuur, pct:100, color:ACCENT()},
    {label:'Particulier', val:o.particulier, pct:o.particulier_pct, color:shade(ACCENT(),10)},
    {label:'Zakelijk', val:o.zakelijk, pct:o.zakelijk_pct, color:shade(ACCENT(),-30)},
    {label:'Waarvan service/reparatie', val:o.reparatie, pct:o.reparatie_pct, color:shade(ACCENT(),-55)},
  ];
  const maxVal = o.factuur;
  return `
  <div class="slide-head"><div class="eyebrow">Omzetopbouw</div><h1 class="slide-title">Omzetopbouw 2025 — ${state.vestiging}</h1>
  <div class="slide-sub">Van totale factuurwaarde naar particulier/zakelijk-verdeling en service/reparatie-aandeel. Alle bedragen excl. btw.</div></div>
  <div class="funnel">
    ${rows.map(r=>`
      <div class="funnel-row">
        <div class="funnel-label">${r.label}</div>
        <div class="funnel-bar-track"><div class="funnel-bar" style="background:${r.color};" data-barwidth="${(r.val/maxVal*100).toFixed(1)}%"></div></div>
        <div class="funnel-amt">${euroK(r.val)}</div>
        <div class="funnel-pct">${pct(r.pct)}</div>
      </div>
    `).join('')}
  </div>

let leafletMap = null;
function initMap(){
  const points = DATA.kaart[state.vestiging];
  if(!points || !points.length) return;
  const mapDiv = document.getElementById('mapEl');
  if(!mapDiv) return;
  if(leafletMap){ leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map('mapEl', {scrollWheelZoom:true}).setView(V().coords, 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-bijdragers', maxZoom: 19, subdomains: 'abc'
  }).addTo(leafletMap);
  const maxOmzet = Math.max(...points.map(p=>p.omzet));
  [...points].sort((a,b)=> a.type==='zakelijk'?-1:1).forEach(p=>{
    const r = 4 + Math.sqrt(p.omzet/maxOmzet)*26;
    const color = p.type==='zakelijk' ? DATA.meta.zakelijk_kleur : ACCENT();
    L.circleMarker([p.lat,p.lon], {radius:r, color:color, weight:1, fillColor:color, fillOpacity:0.45})
      .addTo(leafletMap).bindPopup(`<b>${p.naam}</b> (${p.pc4}) — ${p.type}<br>Omzet: ${euroK(p.omzet)}<br>Orders: ${p.klanten}`);
  });
  L.marker(V().coords).addTo(leafletMap).bindPopup(`<b>Van der Wal ${state.vestiging}</b><br>${V().adres}`);
}

      <div class="kpi-label">Omzet</div>
      <div class="bh-100bar">
        <div class="bh-100seg" style="width:${d.pct_omzet_bussum}%; background:${BUSSUM_KLEUR};">${pct(d.pct_omzet_bussum,1)}</div>
        <div class="bh-100seg" style="width:${d.pct_omzet_hilversum}%; background:${HILVERSUM_KLEUR};">${pct(d.pct_omzet_hilversum,1)}</div>
      </div>
      <div class="rank-sub" style="margin-top:8px;">${euroK(d.bussum_omzet)} Bussum · ${euroK(d.hilversum_omzet)} Hilversum · ${euroK(d.totaal_omzet)} totaal</div>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="kpi-label" style="margin-bottom:10px;">Orders per postcode richting Hilversum</div>
    ${d.postcodes.map(p=>`
      <div class="bh-pc-row">
        <div class="bh-pc-code">${p.pc}</div>
        <div class="bh-pc-track"><div class="bh-pc-fill" style="width:${(p.orders/maxPc*100).toFixed(0)}%; background:${HILVERSUM_KLEUR};"></div></div>
        <div class="bh-pc-val">${p.orders}</div>
      </div>
    `).join('')}
  </div>

  <div class="bh-question">Wat maakt dat ongeveer één op de vijf orders uit de directe omgeving toch voor Hilversum kiest?</div>

  <div class="note">Bron: verkoopregels 2025. Alleen particuliere orders vanaf Excel-rij 254. Directe omgeving: postcodegebieden 1401–1406, 1411 en 1412. Bedragen excl. btw.</div>
  `;
}

window.SLIDES = SLIDES;
window.state = state;
window.goTo = goTo;
window.DATA = DATA;
updateAccentVar();
goTo(0);

// ---------- login gate ----------
(function(){
  const WACHTWOORD = "@mbianceVDW";
  const gate = document.getElementById('loginGate');
  const input = document.getElementById('loginInput');
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  function tryLogin(){
    if(input.value === WACHTWOORD){
      gate.style.display = 'none';
    } else {
      err.textContent = 'Onjuist wachtwoord';
      input.classList.remove('error');
      void input.offsetWidth;
      input.classList.add('error');
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });
  input.focus();
})();

</script>
